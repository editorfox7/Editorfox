<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal PDF & Word Converter</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<!-- Styles -->
<style>
:root {
  --primary-color: #4a90e2;
  --bg-color: #f5f5f5;
  --text-color: #333;
  --card-bg: #fff;
}
[data-theme="dark"] {
  --bg-color: #1e1e1e;
  --text-color: #f5f5f5;
  --card-bg: #2a2a2a;
}
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
}
header {
  padding: 1rem;
  background: var(--primary-color);
  color: #fff;
  text-align: center;
}
h1 {
  margin: 0;
  font-size: 1.5rem;
}
.container {
  max-width: 900px;
  margin: 2rem auto;
  padding: 1rem;
}
.card {
  background: var(--card-bg);
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
input[type=file] {
  display: none;
}
label.file-upload {
  display: inline-block;
  padding: 0.5rem 1rem;
  background: var(--primary-color);
  color: #fff;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 1rem;
}
button {
  background: var(--primary-color);
  color: #fff;
  padding: 0.5rem 1rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 0.5rem;
}
button:disabled {
  background: #aaa;
  cursor: not-allowed;
}
.file-list {
  list-style: none;
  padding: 0;
}
.file-list li {
  margin-bottom: 0.5rem;
}
.toggle-theme {
  position: absolute;
  top: 1rem;
  right: 1rem;
  cursor: pointer;
  font-size: 1.2rem;
}
.progress {
  width: 100%;
  background: #ccc;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 0.5rem;
}
.progress-bar {
  width: 0%;
  height: 10px;
  background: var(--primary-color);
}
@media (max-width: 600px) {
  body { font-size: 14px; }
  button, label.file-upload { width: 100%; text-align: center; }
}
</style>
</head>
<body data-theme="light">
<header>
  <h1>Universal PDF & Word Converter</h1>
  <i class="fas fa-moon toggle-theme" id="themeToggle"></i>
</header>

<div class="container">
  <!-- File Upload Section -->
  <div class="card">
    <h2>Upload Files</h2>
    <label class="file-upload">
      <i class="fas fa-upload"></i> Select Files
      <input type="file" id="fileInput" multiple>
    </label>
    <ul id="fileList" class="file-list"></ul>
  </div>

  <!-- Conversion Options -->
  <div class="card">
    <h2>Conversion Options</h2>
    <select id="convertType">
      <option value="wordToPdf">Word → PDF</option>
      <option value="textToPdf">Text → PDF</option>
      <option value="imageToPdf">Image → PDF</option>
      <option value="pdfToText">PDF → Text → Word</option>
      <option value="mergePdf">Merge PDFs</option>
      <option value="splitPdf">Split PDF</option>
    </select>
    <button id="convertBtn">Convert</button>
    <div class="progress" id="progress" style="display:none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Download Section -->
  <div class="card">
    <h2>Converted Files</h2>
    <ul id="downloadList" class="file-list"></ul>
  </div>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.3.2/docx.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.212/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.2.1/dist/tesseract.min.js"></script>

<!-- Script -->
<script>
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const body = document.body;
  body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
});

// File handling
let files = [];
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
fileInput.addEventListener('change', (e) => {
  files = Array.from(e.target.files);
  displayFiles();
});
function displayFiles() {
  fileList.innerHTML = '';
  files.forEach((file, idx) => {
    const li = document.createElement('li');
    li.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB)';
    fileList.appendChild(li);
  });
}

// Conversion
const convertBtn = document.getElementById('convertBtn');
const convertType = document.getElementById('convertType');
const downloadList = document.getElementById('downloadList');
const progressBar = document.getElementById('progressBar');
const progress = document.getElementById('progress');

convertBtn.addEventListener('click', async () => {
  if(files.length===0){ alert('Select files first!'); return;}
  downloadList.innerHTML = '';
  progress.style.display = 'block';
  progressBar.style.width = '0%';
  const step = 100/files.length;
  for(let i=0;i<files.length;i++){
    const file = files[i];
    try{
      let converted;
      switch(convertType.value){
        case 'wordToPdf':
          converted = await wordToPdf(file); break;
        case 'textToPdf':
          converted = await textToPdf(file); break;
        case 'imageToPdf':
          converted = await imageToPdf(file); break;
        case 'pdfToText':
          converted = await pdfToTextWord(file); break;
        case 'mergePdf':
          converted = await mergePdf(files); i=files.length; break;
        case 'splitPdf':
          converted = await splitPdf(file); break;
      }
      if(converted){
        if(Array.isArray(converted)){
          converted.forEach(addDownload);
        } else addDownload(converted);
      }
    }catch(err){console.error(err);}
    progressBar.style.width = ((i+1)*step) + '%';
  }
  progress.style.display = 'none';
});

// Conversion Functions
async function wordToPdf(file){
  const arrayBuffer = await file.arrayBuffer();
  const doc = await docx.Document.load(arrayBuffer);
  const htmlContent = doc.getFullText(); // simple text
  const pdfBlob = await html2pdf().from(htmlContent).outputPdf('blob');
  pdfBlob.name = file.name.replace(/\.\w+$/,'') + '.pdf';
  return pdfBlob;
}

async function textToPdf(file){
  const text = await file.text();
  const pdfBlob = await html2pdf().from(text).outputPdf('blob');
  pdfBlob.name = file.name.replace(/\.\w+$/,'') + '.pdf';
  return pdfBlob;
}

async function imageToPdf(file){
  const pdfBlob = await html2pdf().from(URL.createObjectURL(file)).outputPdf('blob');
  pdfBlob.name = file.name.replace(/\.\w+$/,'') + '.pdf';
  return pdfBlob;
}

async function pdfToTextWord(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
  let fullText='';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const strings = content.items.map(item=>item.str);
    fullText += strings.join(' ') + '\n\n';
  }
  // Convert to simple Word
  const { Document, Packer, Paragraph, TextRun } = docx;
  const doc = new Document();
  doc.addSection({children:[new Paragraph({children:[new TextRun(fullText)]})]});
  const blob = await Packer.toBlob(doc);
  blob.name = file.name.replace(/\.\w+$/,'') + '.docx';
  return blob;
}

async function mergePdf(fileArray){
  const mergedPdf = await PDFLib.PDFDocument.create();
  for(const f of fileArray){
    const data = await f.arrayBuffer();
    const pdf = await PDFLib.PDFDocument.load(data);
    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
    copiedPages.forEach(page => mergedPdf.addPage(page));
  }
  const mergedBlob = new Blob([await mergedPdf.save()], {type:'application/pdf'});
  mergedBlob.name = 'merged.pdf';
  return mergedBlob;
}

async function splitPdf(file){
  const data = await file.arrayBuffer();
  const pdf = await PDFLib.PDFDocument.load(data);
  const blobs = [];
  for(let i=0;i<pdf.getPageCount();i++){
    const newPdf = await PDFLib.PDFDocument.create();
    const [copied] = await newPdf.copyPages(pdf,[i]);
    newPdf.addPage(copied);
    const blob = new Blob([await newPdf.save()],{type:'application/pdf'});
    blob.name = file.name.replace(/\.\w+$/,'')+'_page'+(i+1)+'.pdf';
    blobs.push(blob);
  }
  return blobs;
}

// Add to download list
function addDownload(blob){
  const li = document.createElement('li');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = blob.name;
  a.textContent = 'Download ' + blob.name;
  li.appendChild(a);
  downloadList.appendChild(li);
}
</script>
</body>
</html>
